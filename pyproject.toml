[project]
name = "searchai-semantic-product-search"
version = "0.1.0"
description = "Review-aware semantic product search: E5 embeddings, ChromaDB hybrid ranking, sentiment and BART summaries"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=5.0.0",
    "bert-score>=0.3.13",
    "chromadb>=1.5.5",
    "faiss-cpu>=1.13.2",
    "fastparquet>=2025.12.0",
    "langdetect>=1.0.9",
    "matplotlib-inline>=0.2.1",
    "missingno>=0.5.2",
    "pandas>=3.0.1",
    "pyarrow>=23.0.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.3.0",
    "streamlit>=1.55.0",
    "wordcloud>=1.9.6",
]
[tool.uv]
override-dependencies = [
    "pandas>=3.0.1"
]
